<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', sans-serif;
        }

        .calculator {
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .display {
            width: 100%;
            height: 60px;
            font-size: 24px;
            text-align: right;
            padding: 10px;
            border: none;
            outline: none;
            border-radius: 10px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .operator {
            background: #ff9f43;
        }

        .equal {
            background: #2ecc71;
        }

        .clear {
            background: #e74c3c;
        }
    </style>

    <script>
        function pick(val) {
            document.getElementById("a").value += val;
        }

        function solve() {
            try {
                var x = document.getElementById("a").value;
                document.getElementById("a").value = eval(x);
            } catch {
                document.getElementById("a").value = "Error";
            }
        }

        function clr() {
            document.getElementById("a").value = "";
        }
    </script>
</head>

<body>

    <div class="calculator">
        <input type="text" id="a" class="display" readonly>

        <div class="buttons">
            <button onclick="clr()" class="clear">C</button>
            <button onclick="pick('/') " class="operator">/</button>
            <button onclick="pick('*')" class="operator">*</button>
            <button onclick="pick('-')" class="operator">-</button>

            <button onclick="pick(7)">7</button>
            <button onclick="pick(8)">8</button>
            <button onclick="pick(9)">9</button>
            <button onclick="pick('+')" class="operator">+</button>

            <button onclick="pick(4)">4</button>
            <button onclick="pick(5)">5</button>
            <button onclick="pick(6)">6</button>
            <button onclick="solve()" class="equal">=</button>

            <button onclick="pick(1)">1</button>
            <button onclick="pick(2)">2</button>
            <button onclick="pick(3)">3</button>
            <button onclick="pick('.')">.</button>

            <button onclick="pick(0)" style="grid-column: span 4;">0</button>
        </div>
    </div>

</body>

</html>
